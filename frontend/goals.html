<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyTasks - Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="goals">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">DT</span>
        <span>DailyTasks</span>
      </div>
      <nav class="nav-list" aria-label="Dashboard">
        <a href="overview.html" class="nav-link" data-view-link="overview">Overview</a>
        <a href="tasks.html" class="nav-link" data-view-link="tasks">Tasks</a>
        <a href="calendar.html" class="nav-link" data-view-link="calendar">Calendar</a>
        <a href="goals.html" class="nav-link active" data-view-link="goals">Goals</a>
      </nav>
      <div class="sidebar-footer">
        <button id="themeToggle" class="ghost-button" type="button">Toggle theme</button>
        <button id="logout" class="danger-button" type="button">Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button id="menuToggle" class="icon-button" type="button" aria-label="Toggle navigation">Menu</button>
        <div>
          <p class="eyebrow">Workspace</p>
          <h1 id="pageTitle">Overview</h1>
        </div>
        <div class="topbar-actions">
          <div class="search-wrap">
            <input id="search" type="search" aria-label="Search tasks" placeholder="Search goals">
          </div>
        </div>
      </header>

      <section id="overview" class="view-section" data-view="overview" hidden>
        <div class="dashboard-grid">
          <article class="stat-card">
            <span>Total tasks</span>
            <strong id="totalTasks">0</strong>
          </article>
          <article class="stat-card">
            <span>Completed</span>
            <strong id="completedTasks">0</strong>
          </article>
          <article class="stat-card">
            <span>Due today</span>
            <strong id="dueToday">0</strong>
          </article>
          <article class="stat-card warning">
            <span>Overdue</span>
            <strong id="overdueTasks">0</strong>
          </article>
        </div>

        <div class="content-grid overview-grid">
          <article class="panel" id="analytics">
            <div class="section-heading">
              <div>
                <p class="eyebrow">Analytics</p>
                <h2>Daily productivity</h2>
              </div>
            </div>
            <div class="progress-ring">
              <span id="avgProgress">0%</span>
            </div>
            <div class="mini-stats">
              <span><b id="completedToday">0</b> completed today</span>
              <span><b id="activeGoals">0</b> active goals</span>
            </div>
          </article>

          <article class="panel notification-panel">
            <div class="section-heading">
              <div>
                <p class="eyebrow">Notifications</p>
                <h2>Reminders</h2>
              </div>
            </div>
            <div id="notifications" class="notification-list"></div>
          </article>
        </div>
      </section>

      <section id="tasks" class="view-section" data-view="tasks" hidden>
        <article class="panel task-panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Task manager</p>
              <h2>Create and filter work</h2>
            </div>
            <div class="segmented">
              <button class="filter-status active" data-status="all" type="button">All</button>
              <button class="filter-status" data-status="open" type="button">Open</button>
              <button class="filter-status" data-status="done" type="button">Done</button>
            </div>
          </div>

          <form id="taskForm" class="task-form">
            <input id="title" placeholder="Task title" required>
            <input id="description" placeholder="Description">
            <select id="priority" aria-label="Priority">
              <option>Medium</option>
              <option>High</option>
              <option>Low</option>
            </select>
            <select id="category" aria-label="Category">
              <option>General</option>
              <option>Work</option>
              <option>Personal</option>
              <option>Health</option>
              <option>Learning</option>
            </select>
            <input id="due" type="date" aria-label="Due date">
            <input id="reminder" type="datetime-local" aria-label="Reminder">
            <label class="range-field">Progress <input id="progress" type="range" min="0" max="100" value="0"></label>
            <button id="addTask" type="submit">Add Task</button>
          </form>

          <div class="filter-row">
            <select id="priorityFilter" aria-label="Filter by priority">
              <option value="all">All priorities</option>
              <option>High</option>
              <option>Medium</option>
              <option>Low</option>
            </select>
            <select id="categoryFilter" aria-label="Filter by category">
              <option value="all">All categories</option>
            </select>
          </div>

          <div id="tasksList" class="task-list"></div>
        </article>
      </section>

      <section id="calendar" class="view-section" data-view="calendar" hidden>
        <article class="panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Calendar view</p>
              <h2>This month</h2>
            </div>
          </div>
          <div id="calendarGrid" class="calendar-grid"></div>
        </article>
      </section>

      <section id="goals" class="view-section" data-view="goals">
        <article class="panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Goals</p>
              <h2>Track outcomes</h2>
            </div>
          </div>
          <form id="goalForm" class="goal-form">
            <input id="gTitle" placeholder="Goal title" required>
            <input id="gNotes" placeholder="Notes">
            <input id="gTarget" type="date" aria-label="Target date">
            <input id="gProgress" type="number" min="0" max="100" value="0" aria-label="Goal progress">
            <button id="addGoal" type="submit">Add Goal</button>
          </form>
          <div id="goalsList" class="goal-list"></div>
        </article>
      </section>
    </main>
  </div>

  <script src="js/tasks.js"></script>
</body>
</html>
